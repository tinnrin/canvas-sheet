<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <canvas id="canvas" width="500" height="500"></canvas>

    <script>
      function translate(x, y) {
        const angle = -45;
        const rad = (angle * Math.PI) / 180;
        return [
          x * Math.cos(rad) - y * Math.sin(rad),
          y * Math.cos(rad) + x * Math.sin(rad),
        ];
      }

      function snap(x, y) {
        const res = [x, y];

        if (!Number.isInteger(x / 10)) {
          res[0] = Math.trunc(x / 10) * 10;
        }
        if (!Number.isInteger(y / 10)) {
          res[1] = Math.trunc(y / 10) * 10;
        }

        return res;
      }

      function getRndmColor() {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);

        const cssColor = "rgb(" + r + ", " + g + "," + b + ")";
        return cssColor;
      }

      var canvas = document.getElementById("canvas");
      var ctx = canvas.getContext("2d");
      ctx.lineWidth = 1;

      ctx.fillStyle = "#929982";
      ctx.fillRect(0, 0, 500, 500);

      const canvS = canvas.getBoundingClientRect();

      const canvOffset = translate(canvS.x, canvS.y)

      console.log(canvS)
      canvas.onclick = (e) => {
        console.log(canvas.getBoundingClientRect())

        // console.log(e)
        // console.log(document.documentElement.scrollLeft) //x
        // console.log(document.documentElement.scrollTop) //y
        console.log('pageX, pageY', e.pageX, e.pageY)
        console.log('pageX, pageY', e.pageX, e.pageY - canvas.offsetTop)
        // console.log('clientX, clientY', e.clientX, e.clientY)
        // // console.log('screenX, screenY', e.screenX, e.screenY)
        // console.log('x, y', e.x, e.y)

        // let shiftX = e.clientX - canvas.getBoundingClientRect().left;
        // let shiftY = e.clientY - canvas.getBoundingClientRect().top;

        // console.log(shiftX, shiftY)
        const arr = translate(e.pageX - canvas.offsetLeft, e.pageY - canvas.offsetTop);

        arr[0] = Math.floor(arr[0] - 250);
        arr[1] = Math.floor(arr[1] + 250);


        const arrSnap = snap(arr[0], arr[1]);

        console.log('snap', arrSnap)

        ctx.fillStyle = getRndmColor();
        ctx.fillRect(arrSnap[1], arrSnap[0], 10, 10);
      };
    </script>

    <style>
      *,
      ::before,
      ::after {
        box-sizing: inherit;
      }

      html {
        box-sizing: border-box;
      }
      body {
        padding: 0;
        margin: 0;
      }
      canvas {
        /* width: 500px;
        height: 500px; */
        transform-origin: top left;
        /* transform: rotate(45deg) translate(250px, -250px); */
        transform: scaleX(-1) rotate(45deg) translate(-250px, 250px);
        image-rendering: pixelated;
      }
    </style>
  </body>
</html>
